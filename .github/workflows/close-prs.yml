name: Close External Pull Requests

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close-pr:
    runs-on: ubuntu-latest
    if: github.actor != 'xabila'
    steps:
      - name: Close Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "👋 Merci pour votre intérêt ! Ce dépôt public héberge le site officiel de QiMétéo (https://qimeteo.app) et n'accepte aucune contribution externe. Tout le code et les créations sont protégés par le droit d'auteur. Cette PR sera fermée automatiquement."
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed"
            });
